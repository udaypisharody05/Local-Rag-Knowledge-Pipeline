services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
    environment:
      APP_NAME: ${APP_NAME:-Local RAG Knowledge Pipeline}
      APP_ENV: ${APP_ENV:-development}
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:-rag_password}@postgres:5432/rag_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      STORAGE_ROOT: /app/storage/documents
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      DENSE_TOP_K: ${DENSE_TOP_K:-5}
      DENSE_MAX_K: ${DENSE_MAX_K:-20}
      SPARSE_TOP_K: ${SPARSE_TOP_K:-5}
      SPARSE_MAX_K: ${SPARSE_MAX_K:-20}
      DENSE_CANDIDATE_K: ${DENSE_CANDIDATE_K:-20}
      SPARSE_CANDIDATE_K: ${SPARSE_CANDIDATE_K:-20}
      HYBRID_TOP_K: ${HYBRID_TOP_K:-5}
      HYBRID_MAX_K: ${HYBRID_MAX_K:-20}
      RRF_K: ${RRF_K:-60}
      GENERATION_MODEL: ${GENERATION_MODEL:-llama3.2:3b}
      GENERATION_TEMPERATURE: ${GENERATION_TEMPERATURE:-0.1}
      GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-120}
      GENERATION_MAX_CONTEXT_CHUNKS: ${GENERATION_MAX_CONTEXT_CHUNKS:-5}
      GENERATION_MAX_CONTEXT_CHARS: ${GENERATION_MAX_CONTEXT_CHARS:-12000}
      INDEX_STORAGE_ROOT: /app/storage/indexes/versions
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - document_storage:/app/storage/documents
      - index_storage:/app/storage/indexes
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  document_storage:
  index_storage:
